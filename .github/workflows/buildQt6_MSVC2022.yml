name: build_Qt6.12.0_msvc2022

on: workflow_dispatch
#on: [push, pull_request]

env:
  QT_VERSION: 6.12.0
  QT_VERSION2: 6.12
  FILE_NAME: shared-Debug-Release_msvc2022_64

jobs:
  windows_msvc_shared_debug_release:
    runs-on: windows-latest

    steps:
    # 1. 检出本仓库
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 安装 python (Qt构建需要)
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        architecture: 'x64'

    # 3. 安装 msvc 环境
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Setup vsdevenv
      uses: seanmiddleditch/gha-setup-vsdevenv@master

    # 4. 下载并解压 Qt 源代码 (使用 bash)
    - name: Download and Extract Qt Source
      shell: bash
      run: |
        # 切换到 D:\a\buildQt 目录
        cd ..
        mkdir -p Qt
        cd Qt
        mkdir -p ${{env.QT_VERSION}}
        mkdir -p ${{env.QT_VERSION}}-shared

        # 下载源代码并解压到指定目录
        curl -L -o qt-everywhere-src.zip https://download.qt.io/official_releases/qt/${{env.QT_VERSION2}}/${{env.QT_VERSION}}/single/qt-everywhere-src-${{env.QT_VERSION}}.zip
        unzip -q qt-everywhere-src.zip -d ./${{env.QT_VERSION}}

    # 5. 执行 cmd 脚本进行编译 (使用 cmd，彻底避免引号嵌套问题)
    - name: Compile Qt
      shell: cmd
      run: |
        call "D:\a\buildQt\buildQt\buildQt6\build-Qt6msvc2022_64.cmd"

    # 6. 打包二进制文件
    - name: Package binaries
      shell: bash
      run: |
        # 注意：此时默认工作目录回到了 D:\a\buildQt\buildQt (仓库根目录)
        7z a Qt_${{env.QT_VERSION}}-${{env.FILE_NAME}}.7z ../Qt/${{env.QT_VERSION}}-shared -mx=9

    # 7. 上传产物
    - uses: actions/upload-artifact@v4
      with:
        name: Qt_${{env.QT_VERSION}}-${{env.FILE_NAME}}
        path: Qt_${{env.QT_VERSION}}-${{env.FILE_NAME}}.7z
